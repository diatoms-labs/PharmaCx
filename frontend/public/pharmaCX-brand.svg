<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <style>
      .bg-navy { fill: #0F3D6E; }
      .bg-primary { fill: #1E7FC4; }
      .accent { fill: #4FB8F5; }
      .white { fill: #FFFFFF; }
      .white-dim { fill: rgba(255,255,255,0.15); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="520" height="200" rx="16" class="bg-navy"/>

  <!-- Logo mark -->
  <rect x="32" y="40" width="72" height="72" rx="14" class="bg-primary"/>

  <!-- Document icon inside mark -->
  <rect x="44" y="50" width="34" height="44" rx="4" class="white-dim"/>
  <rect x="44" y="50" width="34" height="44" rx="4" fill="none" stroke="white" stroke-width="2"/>
  <line x1="51" y1="63" x2="71" y2="63" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="72" x2="71" y2="72" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="81" x2="63" y2="81" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- CX badge -->
  <circle cx="88" cy="94" r="14" class="accent"/>
  <text x="88" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0F3D6E">CX</text>

  <!-- Wordmark -->
  <text x="122" y="86" font-family="Arial, sans-serif" font-size="42" font-weight="400" fill="#FFFFFF" letter-spacing="-1">Pharma</text>
  <text x="330" y="86" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#4FB8F5" letter-spacing="-1">CX</text>

  <!-- Tagline -->
  <text x="122" y="110" font-family="Arial, sans-serif" font-size="13" fill="#7BB8D8" letter-spacing="0.5">Compliance Execution Platform  ·  21 CFR Part 11  ·  GxP</text>

  <!-- Divider -->
  <line x1="32" y1="132" x2="488" y2="132" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Color swatches row -->
  <rect x="32" y="148" width="28" height="28" rx="6" fill="#0F3D6E" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="46" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7BB8D8">#0F3D6E</text>

  <rect x="70" y="148" width="28" height="28" rx="6" fill="#1E7FC4"/>
  <text x="84" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7BB8D8">#1E7FC4</text>

  <rect x="108" y="148" width="28" height="28" rx="6" fill="#4FB8F5"/>
  <text x="122" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7BB8D8">#4FB8F5</text>

  <rect x="146" y="148" width="28" height="28" rx="6" fill="#E8F4FB"/>
  <text x="160" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7BB8D8">#E8F4FB</text>

  <rect x="184" y="148" width="28" height="28" rx="6" fill="#1B6B3A"/>
  <text x="198" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7BB8D8">#1B6B3A</text>

  <rect x="222" y="148" width="28" height="28" rx="6" fill="#5F5E5A"/>
  <text x="236" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7BB8D8">#5F5E5A</text>

  <!-- Light version preview -->
  <rect x="300" y="140" width="188" height="44" rx="10" fill="#F0F7FC"/>
  <text x="316" y="157" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#0F3D6E">Pharma</text>
  <text x="430" y="157" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1E7FC4">CX</text>
  <text x="316" y="173" font-family="Arial, sans-serif" font-size="9" fill="#7BB8D8" letter-spacing="0.3">Light background variant</text>
</svg>
